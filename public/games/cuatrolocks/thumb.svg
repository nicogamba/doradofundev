    <rect x="188" y="480" width="38" height="38"/>
    <rect x="226" y="480" width="38" height="38"/>
    <rect x="264" y="480" width="38" height="38"/>
    <rect x="302" y="480" width="38" height="38"/>
    <rect x="150" y="442" width="38" height="38"/>
    <rect x="226" y="442" width="38" height="38"/>
    <rect x="302" y="442" width="38" height="38"/>
    <rect x="226" y="404" width="38" height="38"/>
    <rect x="302" y="404" width="38" height="38"/>
    <rect x="264" y="366" width="38" height="38"/>
    <rect x="302" y="366" width="38" height="38"/>
    <rect x="302" y="328" width="38" height="38"/>
  </g>

  <!-- pieza cayendo -->
  <g fill="#e0503f" stroke="#7a2420" stroke-width="2">
    <rect x="188" y="250" width="38" height="38"/>
    <rect x="226" y="250" width="38" height="38"/>
    <rect x="264" y="250" width="38" height="38"/>
    <rect x="264" y="212" width="38" height="38"/>
