    <rect x="-6" y="-10" width="12" height="12" fill="#ffd166" rx="2"/>
    <rect x="-2" y="2" width="4" height="12" fill="#ffd166"/>
    <rect x="-6" y="14" width="6" height="4" fill="#ffd166" rx="1"/>
  </g>

  <g fill="#0c0e14">
