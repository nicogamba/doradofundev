<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Looking4Stars</title>
    <link rel="stylesheet" href="./game.css" />
  </head>
  <body>
    <canvas id="game"></canvas>

    <div id="hud" class="hud hidden">
      <span id="hud-level"></span>
      <span id="hud-score"></span>
      <span id="hud-balls"></span>
      <span id="hud-aliens"></span>
      <span id="hud-time" class="hud-time hidden"></span>
      <span id="hud-powers" class="hud-powers hidden"></span>
      <button id="hud-map" class="btn-mini" type="button"></button>
    </div>

    <div id="overlay" class="overlay hidden">
      <h1 id="ov-title"></h1>
      <p id="ov-text"></p>
      <div id="ov-powers" class="powers hidden"></div>
      <div id="ov-legend" class="legend"></div>
      <div class="overlay-btns">
        <button id="ov-btn" class="btn" type="button"></button>
        <button id="ov-btn2" class="btn btn2 hidden" type="button"></button>
      </div>
    </div>

    <script src="./i18n.js"></script>
    <script src="./game.js"></script>
  </body>
</html>
